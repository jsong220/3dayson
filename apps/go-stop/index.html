<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="build" content="3DAYSON-V3-2026-10-01">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d14">
  <title>Go-Stop (Hwatu)</title>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="bird" viewBox="0 0 24 24">
        <ellipse cx="10" cy="14" rx="8" ry="5.5" />
        <circle cx="16" cy="8" r="4" />
        <path d="M19.5 7.5 24 9l-4.5 1zM2 12 0 8l3 8z" />
      </symbol>
      <symbol id="sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="6" />
        <path d="M12 1v4M12 19v4M1 12h4M19 12h4M4 4l3 3M17 17l3 3M20 4l-3 3M7 17l-3 3" stroke="currentColor"
          stroke-width="2" fill="none" />
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <header>
      <!-- Removed #msg from here -->
      <div class="scores">
        <button type="button" class="btn" id="btnRules" title="How to play">RULES</button>
      </div>
      <button type="button" class="money" id="bankBtn" title="View pot history" aria-label="Bankroll, view pot history"><b id="bank">$0</b></button>
      <div class="hbtns">
        <button type="button" class="btn" id="btnLabels" aria-pressed="false" title="Show month numbers on cards">LABELS: OFF</button>
        <button type="button" class="btn icon" id="btnSound" title="Toggle sound" aria-label="Toggle sound">🔊</button>
        <button type="button" class="btn icon" id="btnSettings" title="Settings" aria-label="Settings">⚙️</button>
        <button type="button" class="btn" id="btn2P" aria-label="Play with a friend (2 player)">2P</button>
        <button type="button" class="btn go" id="btnNew">RESTART</button>
      </div>
    </header>
    <main class="center">
      <div id="cpuHand" class="hand cpu" role="img" aria-label="Opponent hand"></div>
      <div id="cpuCaptured" class="captured cpu-captured" data-empty="OPPONENT CAPTURED - CLICK TO VIEW"
        role="button" tabindex="0" aria-label="Opponent captured cards, open list" title="Click to see collected cards"></div>
      <section class="table">
        <!-- Moved #msg to the top of the table section -->
        <div id="msg" role="status" aria-live="polite">Loading...</div>
        <div id="tableCards" role="group" aria-label="Cards on the table"></div>
        <div class="deck-col">
          <div id="deck" class="deck" role="button" tabindex="0" aria-label="Deck"><span id="deckN">20</span></div>
        </div>
      </section>
      <div id="myCaptured" class="captured" data-empty="YOUR CAPTURED CARDS - CLICK TO VIEW" role="button" tabindex="0" aria-label="Your captured cards, open list" title="Click to see collected cards"></div>
      <div id="myHand" class="hand" role="group" aria-label="Your hand"></div>
    </main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="box" id="modalBox" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script src="js/multiplayer.js" defer></script>
</body>

</html>
