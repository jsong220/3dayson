<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b09">
    <title>Hello</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a472a'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' fill='white'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #070b09;
            --fg: #f2f5f3;
            --muted: #6f7c75;
            --accent: #4ade80;
            --row: 64px;    /* height of one option */
            --view: 152px;  /* visible height of the picker (shows the middle option + a peek of its neighbours) */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: var(--bg); }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(ellipse at 50% 42%, rgba(74, 222, 128, 0.07), transparent 60%),
                var(--bg);
            color: var(--fg);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            /* Three rows: the greeting sits in the exact middle row, the menu hangs underneath it */
            display: grid;
            grid-template-rows: 1fr auto 1fr;
            justify-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hello {
            grid-row: 2;
            align-self: center;
            font-size: clamp(2.4rem, 9vw, 4.25rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            text-align: center;
            padding: 0 24px;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 0.9s ease-out 0.15s forwards;
        }

        .menu {
            grid-row: 3;
            align-self: start;
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fade 0.9s ease-out 0.9s forwards;
        }

        /* Scrollable, snapping list. Scroll (wheel / swipe) to bring an option to the centre. */
        .picker {
            position: relative;
            width: min(320px, 84vw);
            height: var(--view);
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            overscroll-behavior: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 27%, #000 73%, transparent 100%);
                    mask-image: linear-gradient(to bottom, transparent 0, #000 27%, #000 73%, transparent 100%);
        }
        .picker::-webkit-scrollbar { display: none; }
        /* Spacers so the first and last options can reach the centre */
        .picker::before,
        .picker::after {
            content: "";
            display: block;
            height: calc((var(--view) - var(--row)) / 2);
        }

        .opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: var(--row);
            scroll-snap-align: center;
            scroll-snap-stop: always;
            color: var(--muted);
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.01em;
            transform: scale(0.86);
            transition: color 0.25s ease, transform 0.25s ease;
            border-radius: 14px;
            cursor: pointer;
        }
        .opt small {
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-top: 3px;
            color: var(--muted);
            opacity: 0.85;
        }
        .opt.active { color: var(--fg); transform: scale(1); }
        .opt.active.live { color: var(--accent); }
        .opt:hover { color: var(--fg); }
        .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

        .hint {
            margin-top: 10px;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            transition: opacity 0.6s ease;
        }
        .hint.gone { opacity: 0; }

        .note {
            margin-top: 6px;
            min-height: 1.2em;        /* reserved so the layout never jumps */
            font-size: 0.85rem;
            color: var(--muted);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .note.show { opacity: 1; }

        @keyframes rise { to { opacity: 1; transform: none; } }
        @keyframes fade { to { opacity: 1; } }

        /* Short screens (phones in landscape): shrink the picker so nothing gets cut off */
        @media (max-height: 460px) {
            :root { --row: 52px; --view: 104px; }
            .opt { font-size: 1.25rem; }
            .hello { font-size: 2rem; }
            .hint { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .hello, .menu { animation: none; opacity: 1; transform: none; }
            .opt, .hint, .note { transition: none; }
        }
    </style>
</head>
<body>

    <h1 class="hello">Hello, you.</h1>

    <nav class="menu" aria-label="Choose something to open">
        <div class="picker" id="picker" role="list">
            <!-- Options are normal links, so they still work if JavaScript is blocked. -->
            <a class="opt" role="listitem" href="#" data-soon="Chess">Chess<small>Coming soon</small></a>
            <a class="opt" role="listitem" href="#" data-soon="News">News<small>Coming soon</small></a>
            <a class="opt live" role="listitem" href="ko-blackjack.html">KO Blackjack<small>Card counting trainer</small></a>
        </div>
        <p class="hint" id="hint">Scroll &middot; tap to open</p>
        <p class="note" id="note" role="status" aria-live="polite"></p>
    </nav>

    <script>
        (function () {
            var picker = document.getElementById('picker');
            var opts = Array.prototype.slice.call(picker.querySelectorAll('.opt'));
            var hint = document.getElementById('hint');
            var note = document.getElementById('note');
            var activeIndex = 0;
            var ticking = false;
            var noteTimer = null;
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Highlight whichever option is closest to the middle of the picker
            function updateActive() {
                ticking = false;
                var mid = picker.scrollTop + picker.clientHeight / 2;
                var best = 0, bestDist = Infinity;
                opts.forEach(function (o, i) {
                    var d = Math.abs(o.offsetTop + o.offsetHeight / 2 - mid);
                    if (d < bestDist) { bestDist = d; best = i; }
                });
                activeIndex = best;
                opts.forEach(function (o, i) { o.classList.toggle('active', i === best); });
            }

            picker.addEventListener('scroll', function () {
                hint.classList.add('gone');
                if (!ticking) { ticking = true; requestAnimationFrame(updateActive); }
            }, { passive: true });
            window.addEventListener('resize', updateActive);
            window.addEventListener('load', updateActive);
            updateActive();

            // "Coming soon" options: stay on the page and say so
            opts.forEach(function (o) {
                o.addEventListener('click', function (e) {
                    var name = o.getAttribute('data-soon');
                    if (!name) return;                       // KO Blackjack: let the link navigate normally
                    e.preventDefault();
                    note.textContent = name + ' is coming soon.';
                    note.classList.add('show');
                    clearTimeout(noteTimer);
                    noteTimer = setTimeout(function () { note.classList.remove('show'); }, 2200);
                });
            });

            // Keyboard: up / down moves through the options
            picker.addEventListener('keydown', function (e) {
                if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
                e.preventDefault();
                var next = Math.max(0, Math.min(opts.length - 1, activeIndex + (e.key === 'ArrowDown' ? 1 : -1)));
                opts[next].focus({ preventScroll: true });
                opts[next].scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
            });
        })();
    </script>
</body>
</html>
