      <button type="button" class="pbtn pad-right" id="btnRight" aria-label="Move right" tabindex="-1">&#9654;</button>
      <button type="button" class="pbtn pad-down" id="btnDown" aria-label="Down" tabindex="-1">&#9660;</button>
