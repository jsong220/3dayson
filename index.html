<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b09">
    <title>Hello</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a472a'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' fill='white'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070b09;
            --fg: #f2f5f3;
            --muted: #6f7c75;
            --accent: #4ade80;
            --row: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: var(--bg); }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(ellipse at 50% 42%, rgba(74, 222, 128, 0.07), transparent 60%),
                var(--bg);
            color: var(--fg);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            -webkit-font-smoothing: none;
            -webkit-tap-highlight-color: transparent;
            display: grid;
            grid-template-rows: 1fr auto 1fr;
            justify-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hello {
            grid-row: 2;
            align-self: center;
            font-size: clamp(1.4rem, 5.5vw, 2.6rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            text-align: center;
            padding: 0 24px;
            min-height: 1.2em;
            line-height: 1.4;
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.25);
        }

        .hello .dots {
            display: inline-block;
            width: 1.2em;
            text-align: left;
        }

        .menu {
            grid-row: 3;
            align-self: start;
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Static list — no scrolling, no snapping */
        .picker {
            position: relative;
            width: min(360px, 88vw);
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: var(--row);
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            transform: scale(0.94);
            transition: color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            outline: none;
            padding: 0 12px;
        }
        .opt small {
            font-size: 0.55rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 6px;
            color: var(--muted);
            opacity: 0.85;
        }
        .opt.active,
        .opt:hover,
        .opt:focus-visible {
            color: var(--fg);
            transform: scale(1);
            background-color: rgba(74, 222, 128, 0.08);
        }
        .opt.active.live,
        .opt.active.live small { color: var(--accent); }
        .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

        /* Cursor indicator on the left of the highlighted option */
        .opt::before {
            content: "";
            position: absolute;
            left: -16px;
            top: 50%;
            width: 8px;
            height: 8px;
            margin-top: -4px;
            background: var(--accent);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 0 8px var(--accent);
        }
        .opt.active::before,
        .opt:hover::before,
        .opt:focus-visible::before {
            opacity: 1;
            transform: scale(1);
        }

        .hint {
            margin-top: 18px;
            font-size: 0.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0.7;
        }

        @media (max-height: 460px) {
            :root { --row: 52px; }
            .opt { font-size: 0.75rem; }
            .opt small { font-size: 0.45rem; }
            .hello { font-size: 1.1rem; }
            .hint { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .opt { transition: none; }
        }
    </style>
</head>
<body>

    <h1 class="hello" id="hello" aria-label="Hello, you"></h1>

    <nav class="menu" aria-label="Choose something to open">
        <div class="picker" id="picker" role="list">
            <a class="opt" role="listitem" href="https://www.chess.com" target="_blank" rel="noopener noreferrer">Chess<small>Chess.com</small></a>
            <a class="opt" role="listitem" href="https://news.google.com" target="_blank" rel="noopener noreferrer">News<small>Google News</small></a>
            <a class="opt live" role="listitem" href="ko-blackjack.html">KO Blackjack<small>Card counting trainer</small></a>
        </div>
        <!-- <p class="hint" id="hint">Tap to open</p> -->
    </nav>

    <script>
        (function () {
            var picker = document.getElementById('picker');
            var opts = Array.prototype.slice.call(picker.querySelectorAll('.opt'));
            var activeIndex = 2; // default highlight = KO Blackjack

            // Set active highlight
            function setActive(i) {
                activeIndex = i;
                opts.forEach(function (o, idx) { o.classList.toggle('active', idx === i); });
            }

            // Hover / focus → highlight
            opts.forEach(function (o, i) {
                o.addEventListener('mouseenter', function () { setActive(i); });
                o.addEventListener('focus', function () { setActive(i); });
            });

            // Keyboard up/down navigation, Enter opens
            picker.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    var next = Math.max(0, Math.min(opts.length - 1, activeIndex + (e.key === 'ArrowDown' ? 1 : -1)));
                    setActive(next);
                    opts[next].focus();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    var target = opts[activeIndex];
                    if (target) {
                        if (target.target === '_blank') {
                            window.open(target.href, '_blank', 'noopener,noreferrer');
                        } else {
                            window.location.href = target.href;
                        }
                    }
                }
            });

            setActive(activeIndex);

            // --- Typewriter greeting with looping dots ---
            var helloEl = document.getElementById('hello');
            var text = 'Hello, you';
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function renderHello(typed, dots) {
                helloEl.innerHTML = typed + '<span class="dots">' + '.'.repeat(dots) + '</span>';
            }

            if (reduceMotion) {
                renderHello(text, 3);
            } else {
                var i = 0;
                renderHello('', 0);

                function typeNext() {
                    if (i < text.length) {
                        i++;
                        renderHello(text.slice(0, i), 0);
                        setTimeout(typeNext, 90);
                    } else {
                        startDots();
                    }
                }

                var dotCount = 1;
                var dotDir = 1;
                function startDots() {
                    renderHello(text, dotCount);
                    setTimeout(function () {
                        dotCount += dotDir;
                        if (dotCount >= 3) { dotCount = 3; dotDir = -1; }
                        else if (dotCount <= 1) { dotCount = 1; dotDir = 1; }
                        startDots();
                    }, 400);
                }

                setTimeout(typeNext, 300);
            }
        })();
    </script>
</body>
</html>
