<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Go-Stop (Hwatu) — Pixel Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { image-rendering: pixelated; image-rendering: crisp-edges; }

        body {
            overscroll-behavior-y: none;
            font-family: 'Press Start 2P', monospace;
            background: #0e1b10;
            background-image:
                linear-gradient(rgba(0,0,0,0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.18) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .card-ghost {
            position: fixed;
            z-index: 9999;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none;
        }

        /* ---------- PIXEL FRAME ---------- */
        .pixel-frame {
            box-shadow:
                inset -3px -3px 0 rgba(0,0,0,0.30),
                inset  3px  3px 0 rgba(255,255,255,0.22);
        }
        .pixel-panel {
            border: 3px solid #050a06;
            box-shadow:
                inset -3px -3px 0 rgba(0,0,0,0.35),
                inset  3px  3px 0 rgba(255,255,255,0.10);
        }
        .pixel-inset {
            border: 3px solid #050a06;
            box-shadow:
                inset  3px  3px 0 rgba(0,0,0,0.35),
                inset -3px -3px 0 rgba(255,255,255,0.10);
        }

        /* ---------- PIXEL BUTTON ---------- */
        .pixel-btn {
            font-family: 'Press Start 2P', monospace;
            border: 3px solid #050a06;
            box-shadow:
                inset -3px -3px 0 rgba(0,0,0,0.45),
                inset  3px  3px 0 rgba(255,255,255,0.30);
            text-transform: uppercase;
            cursor: pointer;
            transition: none;
        }
        .pixel-btn:hover { filter: brightness(1.15); }
        .pixel-btn:active {
            box-shadow:
                inset  3px  3px 0 rgba(0,0,0,0.45),
                inset -3px -3px 0 rgba(255,255,255,0.30);
            transform: translate(2px, 2px);
        }

        /* ---------- CARD ---------- */
        .pixel-card {
            border: 3px solid #050a06;
            box-shadow:
                inset -2px -2px 0 rgba(0,0,0,0.25),
                inset  2px  2px 0 rgba(255,255,255,0.55);
            image-rendering: pixelated;
        }
        .pixel-card-back {
            background: #7a1a1a;
            background-image:
                linear-gradient(45deg, #5a0f0f 25%, transparent 25%),
                linear-gradient(-45deg, #5a0f0f 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #5a0f0f 75%),
                linear-gradient(-45deg, transparent 75%, #5a0f0f 75%);
            background-size: 8px 8px;
            background-position: 0 0, 0 4px, 4px -4px, -4px 0;
            border: 3px solid #050a06;
        }

        .card-hover {
            transition: transform 0.15s steps(3), filter 0.15s;
        }
        .card-hover:hover {
            transform: translateY(-14px);
            filter: brightness(1.08);
            z-index: 50 !important;
        }

        .writing-vertical { writing-mode: vertical-rl; text-orientation: upright; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes pulse-ring {
            0%   { box-shadow: 0 0 0 0 rgba(255,217,59,0.9); }
            70%  { box-shadow: 0 0 0 12px rgba(255,217,59,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,217,59,0); }
        }
        .selectable-card {
            cursor: pointer;
            animation: pulse-ring 1.4s infinite;
            outline: 3px solid #ffd93b;
            outline-offset: 2px;
            transform: scale(1.12);
            z-index: 40;
        }

        .table-group { transition: transform 0.3s steps(4), box-shadow 0.3s steps(4); }
        .table-card { transition: transform 0.22s steps(4), opacity 0.22s, filter 0.22s; }

        .dim-card {
            opacity: 0.35;
            filter: grayscale(80%) brightness(0.7);
            transform: scale(0.94);
        }
        .match-highlight {
            outline: 4px solid #ffd93b;
            outline-offset: 3px;
            transform: translateY(-8px) scale(1.06);
            z-index: 30;
            filter: brightness(1.2);
        }
        @keyframes match-pulse {
            0%   { outline: 0px solid rgba(255,217,59,0); transform: translateY(0) scale(1); }
            50%  { outline: 5px solid rgba(255,217,59,0.9); transform: translateY(-8px) scale(1.06); }
            100% { outline: 0px solid rgba(255,217,59,0); transform: translateY(0) scale(1); }
        }
        .match-pulse {
            animation: match-pulse 0.42s steps(3) 2;
            position: relative;
            z-index: 30;
        }
        @keyframes pop-in {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: pop-in 0.24s steps(4); }

        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: #050a06; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #3a8c3a; border: 1px solid #050a06; }
        .sidebar-scroll { scrollbar-width: thin; scrollbar-color: #3a8c3a #050a06; }

        @keyframes popup-in {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .popup-in { animation: popup-in 0.16s steps(3); }

        @keyframes bonus-flash {
            0%   { background-color: rgba(255,217,59,0.7); }
            100% { background-color: transparent; }
        }
        .bonus-flash { animation: bonus-flash 1.2s steps(6); }

        /* compact retro text */
        .retro-shadow {
            text-shadow: 2px 2px 0 #050a06;
        }
        .retro-title {
            text-shadow: 3px 3px 0 #050a06;
        }
    </style>
</head>

        function renderPixelIcon(iconDef, sizePercent = 100) {
            if (!iconDef) return '';
            const { rows, palette } = iconDef;
            const h = rows.length;
            const w = rows[0].length;
            let rects = '';
            rows.forEach((row, y) => {
                let x = 0;
                while (x < row.length) {
                    const ch = row[x];
                    if (ch === '.') { x++; continue; }
                    let len = 1;
                    while (x + len < row.length && row[x + len] === ch) len++;
                    rects += `<rect x="${x}" y="${y}" width="${len}" height="1" fill="${palette[ch]}"/>`;
                    x += len;
                }
            });
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet" style="width:${sizePercent}%;height:${sizePercent}%;">${rects}</svg>`;
        }

        const GROUP_META = {
            [CARD_TYPES.KWANG]: { icon: '★', label: 'Kwang', color: '#ffd93b',   bg: '#3a2e08', border: '#ffd93b' },
            [CARD_TYPES.YUL]:   { icon: '♦', label: 'Yul',   color: '#7dd87d', bg: '#0f2e0f', border: '#3a8c3a' },
            [CARD_TYPES.TTI]:   { icon: '≡', label: 'Tti',   color: '#ff8888', bg: '#3a0f0f', border: '#c03030' },
            [CARD_TYPES.PI]:    { icon: '▪', label: 'Pi',    color: '#c0c0d0', bg: '#1a1a22', border: '#6070a0' },
        };

        const MONTH_THEMES = {

            2:  { bg: '#e8c8c8', name: 'Plum' },
            3:  { bg: '#f0d0e0', name: 'Cherry' },

            8:  { bg: '#d8d8d8', name: 'Moon' },

        const BASE_DECK = [
            { month: 1, type: CARD_TYPES.KWANG }, { month: 1, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_POETRY }, { month: 1, type: CARD_TYPES.PI }, { month: 1, type: CARD_TYPES.PI },
            { month: 2, type: CARD_TYPES.YUL, isBird: true }, { month: 2, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_POETRY }, { month: 2, type: CARD_TYPES.PI }, { month: 2, type: CARD_TYPES.PI },
            { month: 3, type: CARD_TYPES.KWANG }, { month: 3, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_POETRY }, { month: 3, type: CARD_TYPES.PI }, { month: 3, type: CARD_TYPES.PI },
            { month: 4, type: CARD_TYPES.YUL, isBird: true }, { month: 4, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_PLAIN }, { month: 4, type: CARD_TYPES.PI }, { month: 4, type: CARD_TYPES.PI },
            { month: 5, type: CARD_TYPES.YUL }, { month: 5, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_PLAIN }, { month: 5, type: CARD_TYPES.PI }, { month: 5, type: CARD_TYPES.PI },
            { month: 6, type: CARD_TYPES.YUL }, { month: 6, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.BLUE }, { month: 6, type: CARD_TYPES.PI }, { month: 6, type: CARD_TYPES.PI },

            { month: 8, type: CARD_TYPES.KWANG }, { month: 8, type: CARD_TYPES.YUL, isBird: true }, { month: 8, type: CARD_TYPES.PI }, { month: 8, type: CARD_TYPES.PI },
            { month: 9, type: CARD_TYPES.YUL, isDoublePi: true, isSpecial: true, countAs: 'pi' }, { month: 9, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.BLUE }, { month: 9, type: CARD_TYPES.PI }, { month: 9, type: CARD_TYPES.PI },

            { month: 12, type: CARD_TYPES.KWANG }, { month: 12, type: CARD_TYPES.YUL }, { month: 12, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RAIN }, { month: 12, type: CARD_TYPES.PI, isDoublePi: true },

        let state = {
            deck: [], playerHand: [], computerHand: [], table: [],
            playerCaptured: [], computerCaptured: [],
            playerScore: 0, computerScore: 0,
            turn: 'player', isAnimating: false, pendingGoStop: null,
            statusText: null, gameOver: false, winner: null, endReason: ''
        };

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        function getEffectiveType(card) {
            if (card.isSpecial) return card.countAs === 'yul' ? CARD_TYPES.YUL : CARD_TYPES.PI;
            return card.type;
        }

        function toggleSpecial(cardId) {
            const allCards = [...state.playerCaptured, ...state.computerCaptured];
            const card = allCards.find(c => c.id === cardId);
            if (!card || !card.isSpecial) return;
            card.countAs = card.countAs === 'yul' ? 'pi' : 'yul';
            state.playerScore = calculateScore(state.playerCaptured);
            state.computerScore = calculateScore(state.computerCaptured);
            renderState();
        }

        function getRowSplits(n) {
            if (n <= 1) return [n];
            const perRow = Math.ceil(n / 2);
            const splits = [];
            let remaining = n;
            for (let i = 0; i < 2; i++) {
                const take = Math.min(perRow, remaining);
                splits.push(take);
                remaining -= take;
            }
            return splits;
        }

        /* ---------- CARD RENDERING ---------- */
        function createCardHTML(card, isHidden = false, interactive = false) {
            if (isHidden) {
                return `<div class="pixel-card-back w-[56px] h-[78px] sm:w-[64px] sm:h-[88px]"></div>`;
            }

            const theme = MONTH_THEMES[card.month];
            const iconSvg = renderPixelIcon(PIXEL_ICONS[card.month], 100);

            let centerOverlay = '';
            if (card.type === CARD_TYPES.KWANG) {
                // Red circle badge with a star
                centerOverlay = `
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20"
                         style="width:34%;height:34%;background:#c02020;border:3px solid #050a06;box-shadow: inset -2px -2px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.3);">
                        <div class="w-full h-full flex items-center justify-center text-[#ffd93b] text-[14px] font-black retro-shadow">★</div>
                    </div>`;
            } else if (card.type === CARD_TYPES.TTI) {
                const ribbonBg = card.ribbon === RIBBON_TYPES.RED_POETRY ? '#c02020'
                              : card.ribbon === RIBBON_TYPES.BLUE ? '#3060c0'
                              : card.ribbon === RIBBON_TYPES.RAIN ? '#207060'
                              : '#c02020';
                centerOverlay = `
                    <div class="absolute top-[6%] left-1/2 -translate-x-1/2 z-20"
                         style="width:22%;height:66%;background:${ribbonBg};border:2px solid #050a06;"></div>`;
            } else if (card.type === CARD_TYPES.YUL && !card.isDoublePi) {
                // The pixel icon itself already shows the picture; no extra overlay
                centerOverlay = '';
            }

            let badge = '';
            if (card.isSpecial) {
                const modeBg = card.countAs === 'pi' ? '#c02020' : '#3a8c3a';
                const modeLabel = card.countAs === 'pi' ? '2P' : 'YL';
                badge = `<div class="absolute bottom-0 right-0 z-30 text-white text-[7px] font-black px-1 py-0.5"
                              style="background:${modeBg};border-top:2px solid #050a06;border-left:2px solid #050a06;">${modeLabel}</div>`;
            } else if (card.isDoublePi) {
                badge = `<div class="absolute bottom-0 right-0 z-30 text-white text-[8px] font-black px-1 py-0.5"
                              style="background:#c02020;border-top:2px solid #050a06;border-left:2px solid #050a06;">2x</div>`;
            } else if (card.isBird) {
                badge = `<div class="absolute bottom-0 right-0 z-30 text-white text-[8px] font-black px-1 py-0.5"
                              style="background:#1a5a1a;border-top:2px solid #050a06;border-left:2px solid #050a06;">B</div>`;
            }

            return `
            <div class="pixel-card relative w-[56px] h-[78px] sm:w-[64px] sm:h-[88px] overflow-hidden ${interactive ? 'card-hover cursor-pointer' : ''}"
                 style="background:${theme.bg};">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div style="width:70%;height:70%;margin-top:4%;">
                        ${iconSvg}
                    </div>
                </div>
                <div class="absolute top-0 left-0 z-10 text-[8px] font-black text-[#050a06] px-1 py-0.5"
                     style="background:#f5e6c8;border-right:2px solid #050a06;border-bottom:2px solid #050a06;">${card.month}</div>
                ${centerOverlay}
                ${badge}
            </div>`;
        }

        function renderState() {
            document.getElementById('deck-count').innerText = state.deck.length;

            const msgEl = document.getElementById('game-message');
            if (state.gameOver) {
                msgEl.innerText = `GAME OVER — YOU ${state.playerScore} : ${state.computerScore} CPU`;
            } else if (state.statusText) {
                msgEl.innerText = state.statusText;
            } else {
                msgEl.innerText = state.turn === 'player' ? 'YOUR TURN' : 'CPU THINKING...';
            }

            renderPlayerHand();
            renderComputerHand();
            renderTable();
            renderCapturedArea('player-captured-sidebar', state.playerCaptured, 'PLAYER', state.playerScore);
            renderCapturedArea('cpu-captured-sidebar', state.computerCaptured, 'CPU', state.computerScore);
        }

        function renderPlayerHand() {
            const container = document.getElementById('player-hand');
            const cards = state.playerHand;
            const canPlay = state.turn === 'player' && !state.isAnimating && !state.gameOver;
            const splits = getRowSplits(cards.length);
            let html = '';
            let idx = 0;
            splits.forEach(count => {
                html += `<div class="flex justify-center gap-1.5">`;
                for (let i = 0; i < count; i++) {
                    const c = cards[idx];
                    const cardIdx = idx;
                    idx++;
                    const hasMatch = state.table.some(t => t.month === c.month);
                    html += `
                        <div id="ph-${c.id}" class="relative"
                             ${canPlay ? `onmouseenter="highlightMatches(${c.month})" onmouseleave="clearHighlights()"` : ''}
                             onclick="handleCardClick(${cardIdx})">
                            ${createCardHTML(c, false, canPlay)}
                            ${(hasMatch && canPlay) ? `<div class="absolute -top-2 -left-2 w-5 h-5 z-30 flex items-center justify-center text-[10px] font-black text-[#1a0e00]"
                                style="background:#ffd93b;border:3px solid #050a06;">!</div>` : ''}
                        </div>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function renderComputerHand() {
            const container = document.getElementById('computer-hand');
            const cards = state.computerHand;
            const splits = getRowSplits(cards.length);
            let html = '';
            let idx = 0;
            splits.forEach(count => {
                html += `<div class="flex justify-center gap-1.5">`;
                for (let i = 0; i < count; i++) {
                    const c = cards[idx];
                    idx++;
                    html += `<div id="ch-${c.id}" class="relative">${createCardHTML(c, true)}</div>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function renderTable() {
            const container = document.getElementById('table-cards');
            if (state.table.length === 0) { container.innerHTML = ''; return; }

            const months = [...new Set(state.table.map(c => c.month))].sort((a, b) => a - b);

            container.innerHTML = months.map(m => {
                const cards = state.table
                    .filter(c => c.month === m)
                    .sort((a, b) => TYPE_RANK[b.type] - TYPE_RANK[a.type]);
                const isPair = cards.length > 1;
                const wrapperStyle = isPair
                    ? 'padding:4px;background:rgba(255,217,59,0.18);border:3px solid #ffd93b;'
                    : '';

                return `
                <div class="table-group flex items-center gap-1" style="${wrapperStyle}">
                    ${cards.map(c => `
                        <div id="tb-${c.id}" class="table-card">
                            ${createCardHTML(c)}
                        </div>`).join('')}
                </div>`;
            }).join('');
        }

        function groupCaptured(cards) {
            return {
                [CARD_TYPES.KWANG]: cards.filter(c => getEffectiveType(c) === CARD_TYPES.KWANG),
                [CARD_TYPES.YUL]: cards.filter(c => getEffectiveType(c) === CARD_TYPES.YUL),
                [CARD_TYPES.TTI]: cards.filter(c => getEffectiveType(c) === CARD_TYPES.TTI),
                [CARD_TYPES.PI]: cards.filter(c => getEffectiveType(c) === CARD_TYPES.PI),
            };
        }

        function sortCapturedCards(cards, type) {
            if (type === CARD_TYPES.TTI) {
                const ribbonOrder = { [RIBBON_TYPES.RED_POETRY]: 0, [RIBBON_TYPES.BLUE]: 1, [RIBBON_TYPES.RED_PLAIN]: 2, [RIBBON_TYPES.RAIN]: 3 };
                return cards.slice().sort((a, b) => {
                    const ra = ribbonOrder[a.ribbon] ?? 4;
                    const rb = ribbonOrder[b.ribbon] ?? 4;
                    if (ra !== rb) return ra - rb;
                    return a.month - b.month;
                });
            }
            if (type === CARD_TYPES.PI) {
                return cards.slice().sort((a, b) => {
                    if (a.isSpecial && !b.isSpecial) return -1;
                    if (!a.isSpecial && b.isSpecial) return 1;
                    if (a.isDoublePi && !b.isDoublePi) return -1;
                    if (!a.isDoublePi && b.isDoublePi) return 1;
                    return a.month - b.month;
                });
            }
            return cards.slice().sort((a, b) => a.month - b.month);
        }

        function renderCapturedArea(elementId, cards, title, score) {
            const container = document.getElementById(elementId);
            const isPlayer = elementId.includes('player');
            const grouped = groupCaptured(cards);

            let html = `
                <div class="flex flex-col items-center justify-center p-2 pixel-inset mb-2 shrink-0" style="background:#050a06;">
                    <h3 class="text-[8px] font-black text-[#7dd87d] tracking-wider">${title}</h3>
                    <p class="text-xl font-black text-white retro-shadow leading-none mt-1">${score}</p>
                </div>
                <div class="flex flex-col gap-1.5">
            `;

            for (const [type, typeCards] of Object.entries(grouped)) {
                if (typeCards.length === 0) continue;
                const meta = GROUP_META[type];
                const sorted = sortCapturedCards(typeCards, type);
                const preview = sorted.slice(0, 3);
                const hasSpecial = sorted.some(c => c.isSpecial);

                let godoriBadge = '';
                if (type === CARD_TYPES.YUL) {
                    const birdCount = typeCards.filter(c => c.isBird).length;
                    if (birdCount === 3) {
                        godoriBadge = `<span class="text-[7px] font-black text-[#0f1f0f] px-1 animate-pulse" style="background:#7dd87d;">GODORI+5</span>`;
                    }
                }

                html += `
                    <div class="pixel-panel cursor-pointer hover:brightness-125 transition-all p-1.5"
                         style="background:${meta.bg}; border-color:${meta.border};"
                         onclick="showGroupPopup('${type}', ${isPlayer})"
                         title="Click to enlarge">
                        <div class="flex items-center gap-1 mb-1">
                            <span class="text-[10px] font-black" style="color:${meta.color};">${meta.icon}</span>
                            <span class="text-[8px] font-black" style="color:${meta.color};">${meta.label.toUpperCase()}</span>
                            ${hasSpecial ? `<span class="text-[7px] font-black text-[#1a0e00] px-1" style="background:#ffd93b;">!</span>` : ''}
                            ${godoriBadge}
                            <span class="text-[7px] font-black text-white ml-auto px-1" style="background:#050a06;">${typeCards.length}</span>
                        </div>
                        <div class="flex justify-center py-0.5">
                            <div class="relative" style="width:52px; height:72px;">
                                ${preview.map((c, i) => {
                                    const offset = i * 2;
                                    const z = 10 - i;
                                    return `<div class="absolute top-0 left-0 origin-top-left" style="transform: translate(${offset}px, ${offset}px) scale(0.66); z-index: ${z};">${createCardHTML(c)}</div>`;
                                }).reverse().join('')}
                            </div>
                        </div>
                    </div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        /* ---------- GROUP POPUP ---------- */

            const typeCards = allCards.filter(c => getEffectiveType(c) === type);
            if (typeCards.length === 0) return;

            const sorted = sortCapturedCards(typeCards, type);

                    <div class="flex items-center justify-center gap-2 mb-3 p-2 pixel-inset" style="background:#3a2e08;">
                        <span class="text-[8px] font-black text-[#ffd93b]">MONTH 9 — COUNT AS:</span>
                        <button onclick="toggleSpecial('${specialCard.id}'); showGroupPopup('${type}', ${isPlayer});"
                                class="pixel-btn text-[8px] px-2 py-1 ${isPiMode ? 'bg-[#c02020] text-white' : 'bg-[#1a1a22] text-[#c08080]'}">2 PI</button>
                        <button onclick="toggleSpecial('${specialCard.id}'); showGroupPopup('${type}', ${isPlayer});"
                                class="pixel-btn text-[8px] px-2 py-1 ${!isPiMode ? 'bg-[#3a8c3a] text-white' : 'bg-[#1a1a22] text-[#80c080]'}">1 YUL</button>

                    godoriLine = `<div class="text-center text-[9px] font-black text-[#7dd87d] mb-2">★ GODORI — 3 BIRD CARDS = 5 POINTS ★</div>`;
                } else if (birdCount > 0) {
                    godoriLine = `<div class="text-center text-[8px] font-black text-white/60 mb-2">${birdCount}/3 BIRD CARDS FOR GODORI (+5)</div>`;
                }
            }

            const popup = document.createElement('div');
            popup.id = 'group-popup';
            popup.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[200] p-4 cursor-pointer';

            popup.innerHTML = `
                <div class="popup-in pixel-panel p-4 sm:p-5 max-w-4xl w-full max-h-[85vh] overflow-y-auto cursor-default"

                                onclick="document.getElementById('group-popup').remove()">×</button>
                    </div>
                    ${specialToggleHtml}
                    ${godoriLine}
                    <div class="flex flex-wrap gap-2 justify-center py-2">
                        ${sorted.map(c => `
                            <div class="relative shrink-0 w-[100px] h-[140px]">
                                <div class="absolute top-0 left-0 origin-top-left" style="transform: scale(1.55);">
                                    ${createCardHTML(c)}
                                </div>

        function highlightMatches(month) {
            document.querySelectorAll('#table-cards [id^="tb-"]').forEach(el => {
                const card = state.table.find(c => c.id === el.id.slice(3));
                if (!card) return;
                if (card.month === month) el.classList.add('match-highlight');
                else el.classList.add('dim-card');
            });
        }

        function clearHighlights() {
            document.querySelectorAll('#table-cards [id^="tb-"]').forEach(el => {
                el.classList.remove('match-highlight', 'dim-card');
            });
        }

        function pulseTableCards(ids) {
            ids.forEach(id => {
                const el = document.getElementById(`tb-${id}`);
                if (el) el.classList.add('match-pulse');
            });
        }

        function animateGhostFromRect(card, startRect, endRect, duration = 400, fadeOut = false, targetScale = 1.05) {
            return new Promise(resolve => {
                if (!startRect || !endRect) { resolve(); return; }

                const ghost = document.createElement('div');
                ghost.className = 'card-ghost';
                ghost.style.transition =
                    `left ${duration}ms steps(8), top ${duration}ms steps(8), transform ${duration}ms steps(8), opacity 160ms steps(4)`;
                ghost.innerHTML = createCardHTML(card);
                ghost.style.left = `${startRect.left}px`;
                ghost.style.top = `${startRect.top}px`;
                ghost.style.width = `${startRect.width}px`;
                ghost.style.height = `${startRect.height}px`;
                document.body.appendChild(ghost);
                void ghost.offsetWidth;

                const targetLeft = endRect.left + (endRect.width - startRect.width) / 2;
                const targetTop = endRect.top + (endRect.height - startRect.height) / 2;

                ghost.style.left = `${targetLeft}px`;
                ghost.style.top = `${targetTop}px`;
                ghost.style.transform = `scale(${targetScale})`;

                setTimeout(() => {
                    if (fadeOut) {
                        ghost.style.opacity = '0';
                        setTimeout(() => { ghost.remove(); resolve(); }, 170);
                    } else {
                        ghost.remove();
                        resolve();
                    }
                }, duration);
            });
        }

        function promptUserSelection(cardsToChooseFrom) {
            return new Promise(resolve => {
                state.statusText = "SELECT A CARD TO CAPTURE!";
                document.getElementById('game-message').innerText = state.statusText;

                cardsToChooseFrom.forEach(c => {
                    const el = document.getElementById(`tb-${c.id}`);
                    if (el) {
                        const innerCard = el.firstElementChild;
                        innerCard.classList.add('selectable-card');
                        innerCard.onclick = () => {
                            cardsToChooseFrom.forEach(c2 => {
                                const el2 = document.getElementById(`tb-${c2.id}`);
                                if (el2) {
                                    el2.firstElementChild.classList.remove('selectable-card');
                                    el2.firstElementChild.onclick = null;
                                }
                            });
                            state.statusText = null;
                            resolve(c);
                        };
                    }
                });
            });
        }

        async function processMatches(playedCard, playerType) {
            const matches = state.table.filter(c => c.month === playedCard.month);
            const captured = [];

            if (matches.length === 3) {
                captured.push(playedCard, ...matches);
                state.table = state.table.filter(c => c.month !== playedCard.month);
            } else if (matches.length === 2) {
                let chosen;
                if (playerType === 'player') {
                    chosen = await promptUserSelection(matches);
                } else {
                    chosen = matches.slice().sort((a, b) => TYPE_RANK[b.type] - TYPE_RANK[a.type])[0];
                }
                captured.push(playedCard, chosen);
                state.table = state.table.filter(c => c.id !== chosen.id);
            } else if (matches.length === 1) {
                captured.push(playedCard, matches[0]);
                state.table = state.table.filter(c => c.id !== matches[0].id);
            } else {
                state.table.push(playedCard);
            }
            return captured;
        }

        async function resolveCardPlacement(card, startRect, playerType, capturedKey, targetArea) {
            const matches = state.table.filter(c => c.month === card.month);

            if (matches.length === 0) {
                state.table.push(card);
                renderState();

                const el = document.getElementById(`tb-${card.id}`);
                if (el && startRect) {
                    el.style.opacity = '0';
                    const landRect = el.getBoundingClientRect();
                    await animateGhostFromRect(card, startRect, landRect, 420);
                    el.style.opacity = '1';
                    el.classList.add('pop-in');
                }
                return [];
            }

            const matchRects = {};
            matches.forEach(c => {
                const el = document.getElementById(`tb-${c.id}`);
                if (el) matchRects[c.id] = el.getBoundingClientRect();
            });

            pulseTableCards(matches.map(c => c.id));
            await sleep(520);

            const firstRect = matchRects[matches[0].id] || null;
            await animateGhostFromRect(card, startRect, firstRect, 420);

            const captured = await processMatches(card, playerType);

            if (captured.length === 0) { renderState(); return []; }

            state[capturedKey].push(...captured);
            renderState();

            const destEl = document.getElementById(targetArea);
            const destRect = destEl ? destEl.getBoundingClientRect() : null;

            captured.forEach(c => {
                const src = (c.id === card.id) ? firstRect : (matchRects[c.id] || firstRect);
                animateGhostFromRect(c, src, destRect, 380, true, 0.7);
            });
            await sleep(440);

            return captured;
        }

        function calculateScore(capturedCards) {
            const kwangs = capturedCards.filter(c => getEffectiveType(c) === CARD_TYPES.KWANG);
            const yuls   = capturedCards.filter(c => getEffectiveType(c) === CARD_TYPES.YUL);
            const ttis   = capturedCards.filter(c => getEffectiveType(c) === CARD_TYPES.TTI);

            let piCount = 0;
            capturedCards.forEach(c => {
                if (getEffectiveType(c) === CARD_TYPES.PI) {
                    piCount += (c.isDoublePi ? 2 : 1);
                }
            });

            let score = 0;

            if (kwangs.length === 5) score += 15;
            else if (kwangs.length === 4) score += 4;
            else if (kwangs.length === 3) {
                const hasRainKwang = kwangs.some(c => c.month === 12);
                score += hasRainKwang ? 2 : 3;
            }

            const birdYuls = yuls.filter(c => c.isBird);
            if (birdYuls.length === 3) score += 5;

            if (yuls.length >= 5) score += (yuls.length - 4);
            if (ttis.length >= 5) score += (ttis.length - 4);

            const redPoetry = ttis.filter(c => c.ribbon === RIBBON_TYPES.RED_POETRY).length;
            const blue      = ttis.filter(c => c.ribbon === RIBBON_TYPES.BLUE).length;
            const redPlain  = ttis.filter(c => c.ribbon === RIBBON_TYPES.RED_PLAIN).length;
            if (redPoetry >= 3) score += 3;
            if (blue >= 3)      score += 3;
            if (redPlain >= 3)  score += 3;

            if (piCount >= 10) score += (piCount - 9);

            return score;
        }

        async function grantBonusPi(playerType) {
            const opponentKey = playerType === 'player' ? 'computerCaptured' : 'playerCaptured';
            const selfKey     = playerType === 'player' ? 'playerCaptured'   : 'computerCaptured';
            const opponentCards = state[opponentKey];

            let piIdx = opponentCards.findIndex(c => getEffectiveType(c) === CARD_TYPES.PI && !c.isDoublePi && !c.isSpecial);
            if (piIdx === -1) piIdx = opponentCards.findIndex(c => getEffectiveType(c) === CARD_TYPES.PI);
            if (piIdx === -1) return;

            const stolen = opponentCards.splice(piIdx, 1)[0];
            state[selfKey].push(stolen);

            state.playerScore = calculateScore(state.playerCaptured);
            state.computerScore = calculateScore(state.computerCaptured);

            const who = playerType === 'player' ? 'YOU' : 'CPU';
            state.statusText = `! SELF-MATCH! ${who} TOOK A PI FROM THE OPPONENT.`;
            renderState();

            const sidebar = document.getElementById(selfKey === 'playerCaptured' ? 'player-captured-sidebar' : 'cpu-captured-sidebar');
            if (sidebar) {
                sidebar.classList.add('bonus-flash');
                setTimeout(() => sidebar.classList.remove('bonus-flash'), 1300);
            }

            await sleep(700);
        }

        async function handleCardClick(index) {
            if (state.turn !== 'player' || state.isAnimating || state.gameOver) return;
            await playTurn('player', index);
        }

        async function playTurn(playerType, cardIndex) {
            if (state.gameOver || state.isAnimating) return;

            state.isAnimating = true;
            state.statusText = null;
            renderState();

            const isPlayer = playerType === 'player';
            const handKey     = isPlayer ? 'playerHand' : 'computerHand';
            const capturedKey = isPlayer ? 'playerCaptured' : 'computerCaptured';
            const handPrefix  = isPlayer ? 'ph' : 'ch';
            const targetArea  = isPlayer ? 'player-captured-sidebar' : 'cpu-captured-sidebar';

            const playedCard = state[handKey][cardIndex];
            if (!playedCard) { state.isAnimating = false; return; }

            const handHadMatch = state.table.some(c => c.month === playedCard.month);

            const startEl = document.getElementById(`${handPrefix}-${playedCard.id}`);
            const startRect = startEl ? startEl.getBoundingClientRect() : null;

            state[handKey].splice(cardIndex, 1);
            renderState();

            await resolveCardPlacement(playedCard, startRect, playerType, capturedKey, targetArea);

            let selfMatchBonus = false;
            if (state.deck.length > 0) {
                await sleep(220);

                const deckCard = state.deck.pop();

                selfMatchBonus = !handHadMatch &&
                                 state.table.some(c => c.id === playedCard.id && c.month === deckCard.month);

                const deckEl = document.getElementById('deck-stack');
                const deckRect = deckEl ? deckEl.getBoundingClientRect() : null;
                renderState();

                await resolveCardPlacement(deckCard, deckRect, playerType, capturedKey, targetArea);
            }

            const prevScore = isPlayer ? state.playerScore : state.computerScore;
            const newScore = calculateScore(state[capturedKey]);
            if (isPlayer) state.playerScore = newScore;
            else state.computerScore = newScore;

            renderState();
            await sleep(300);

            if (selfMatchBonus) {
                await grantBonusPi(playerType);
            }

            if (state.playerHand.length === 0 && state.computerHand.length === 0) {
                endGame(null, 'NO CARDS LEFT ON THE TABLE.');
                return;
            }

            if (newScore >= 7 && newScore > prevScore) {
                state.pendingGoStop = playerType;
                showGoStopModal(playerType, newScore);
                return;
            }

            passTurn(playerType);
        }

        function passTurn(currentPlayer) {
            state.turn = currentPlayer === 'player' ? 'computer' : 'player';
            state.isAnimating = false;
            renderState();
            if (state.turn === 'computer') setTimeout(playComputerTurn, 800);
        }

        function playComputerTurn() {
            if (state.gameOver) return;
            let bestIndex = 0;
            for (let i = 0; i < state.computerHand.length; i++) {
                if (state.table.some(t => t.month === state.computerHand[i].month)) {
                    bestIndex = i;
                    break;
                }
            }
            playTurn('computer', bestIndex);
        }

        function showGoStopModal(playerType, score) {
            const modal = document.getElementById('modal-gostop');
            const msg = document.getElementById('gostop-message');
            const actions = document.getElementById('gostop-actions');
            const waiting = document.getElementById('gostop-waiting');
            const modalInner = modal.querySelector('div');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalInner.classList.remove('scale-90');
                modalInner.classList.add('scale-100');
            }, 10);

            if (playerType === 'player') {
                msg.innerText = `YOU REACHED ${score} POINTS!`;
                actions.classList.remove('hidden');
                waiting.classList.add('hidden');
            } else {
                msg.innerText = `COMPUTER REACHED ${score} POINTS!`;
                actions.classList.add('hidden');
                waiting.classList.remove('hidden');
                setTimeout(() => handleStop(true), 1600);
            }
        }

        function closeGoStopModal() {
            const modal = document.getElementById('modal-gostop');
            if (!modal || modal.classList.contains('hidden')) return;
            const modalInner = modal.querySelector('div');
            modal.classList.add('opacity-0');
            modalInner.classList.remove('scale-100');
            modalInner.classList.add('scale-90');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function handleGo(isComputer = false) {
            closeGoStopModal();
            const prevPlayer = state.pendingGoStop;
            state.pendingGoStop = null;
            state.statusText = `${isComputer ? 'COMPUTER' : 'PLAYER'} CALLED GO!`;
            passTurn(prevPlayer);
        }

        function handleStop(isComputer = false) {
            closeGoStopModal();
            state.pendingGoStop = null;
            endGame(isComputer ? 'Computer' : 'Player',
                    `${isComputer ? 'THE COMPUTER' : 'YOU'} CALLED STOP.`);
        }

        function endGame(winner = null, reason = '') {
            state.isAnimating = true;
            state.gameOver = true;

            if (!winner) {
                winner = state.playerScore > state.computerScore ? 'Player'
                       : state.computerScore > state.playerScore ? 'Computer'
                       : 'Draw';
            }
            state.winner = winner;
            state.endReason = reason;

            renderState();
            showGameOverModal();
        }

        function updateGameOverModal() {
            const title = document.getElementById('gameover-title');
            const msg = document.getElementById('gameover-message');

            document.getElementById('gameover-player-score').innerText = state.playerScore;
            document.getElementById('gameover-computer-score').innerText = state.computerScore;

            if (state.winner === 'Player') {
                title.innerText = 'YOU WIN!';
                title.style.color = '#1a5a1a';
            } else if (state.winner === 'Computer') {
                title.innerText = 'CPU WINS!';
                title.style.color = '#7a1a1a';
            } else {
                title.innerText = 'DRAW!';
                title.style.color = '#5a4020';
            }

            msg.innerText = state.endReason || '';
        }

        function showGameOverModal() {
            if (!state.gameOver) return;
            updateGameOverModal();

            const modal = document.getElementById('modal-gameover');
            const modalInner = modal.querySelector('div');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalInner.classList.remove('scale-90');
                modalInner.classList.add('scale-100');
            }, 10);

            document.getElementById('btn-view-results').classList.add('hidden');
        }

        function hideGameOverModal() {
            const modal = document.getElementById('modal-gameover');
            const modalInner = modal.querySelector('div');

            modal.classList.add('opacity-0');
            modalInner.classList.remove('scale-100');
            modalInner.classList.add('scale-90');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);

            document.getElementById('btn-view-results').classList.remove('hidden');
        }

        function startNewGame() {
            const popup = document.getElementById('group-popup');
            if (popup) popup.remove();

            hideGameOverModal();
            document.getElementById('modal-gameover').classList.add('hidden');
            document.getElementById('btn-view-results').classList.add('hidden');
            closeGoStopModal();
            clearHighlights();

            let deck = BASE_DECK.map((c, i) => ({ ...c, id: `c_${i}` }));
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            const sortHand = (a, b) => (a.month - b.month) || (TYPE_RANK[b.type] - TYPE_RANK[a.type]);

            state = {
                deck: deck.splice(0, 20),
                playerHand: deck.splice(0, 10).sort(sortHand),
                computerHand: deck.splice(0, 10).sort(sortHand),
                table: deck.splice(0, 8),
                playerCaptured: [],
                computerCaptured: [],
                playerScore: 0,
                computerScore: 0,
                turn: 'player',
                isAnimating: false,
                pendingGoStop: null,
                statusText: 'GAME STARTED!',
                gameOver: false,
                winner: null,
                endReason: ''
            };

            renderState();
        }

        window.onload = startNewGame;
    </script>
</body>
</html>
