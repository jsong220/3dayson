          <path d="M24 8h12l-6 30z" />
          <path d="M38 8h12l-6 34z" />

        <ellipse cx="10" cy="14" rx="8" ry="5.5" />

        <circle cx="12" cy="12" r="6" />

  </svg>

  <div class="app">
    <header>
      <!-- Removed #msg from here -->
      <div class="scores">
        <button type="button" class="sc" id="scMe" title="View your captured groups"><em>YOU</em> <b
            id="pScore">0</b></button>
        <span class="vs">·</span>
        <button type="button" class="sc" id="scOpp" title="View opponent captured groups"><em id="oppLabel">CPU</em> <b
            id="cScore">0</b></button>
      </div>
      <div class="money" title="Session bankroll"><span>$</span><b id="bank">0</b></div>
      <div class="hbtns">
        <button hidden class="btn" id="btnMyCards">MY CARDS</button>
        <button class="btn" id="btnLabels">LABELS: OFF</button>
        <button class="btn" id="btn2P">2P</button>
        <button class="btn go" id="btnNew">RESTART</button>
      </div>
    </header>
    <main class="center">
      <div id="cpuHand" class="hand cpu"></div>
      <div id="cpuCaptured" class="captured cpu-captured" data-empty="OPPONENT CAPTURED"
        aria-label="Opponent captured cards"></div>
      <section class="table">
        <!-- Moved #msg to the top of the table section -->
        <div id="msg">Loading...</div>
        <div id="tableCards"></div>
        <div class="deck-col">
          <div id="deck" class="deck"><span id="deckN">20</span></div>
        </div>
      </section>
      <div id="myCaptured" class="captured" data-empty="YOUR CAPTURED CARDS" aria-label="Your captured cards"></div>
      <div id="myHand" class="hand"></div>
    </main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="box" id="modalBox"></div>
  </div>
  <script src="go-stop-art.js"></script>
  <script src="go-stop.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script src="go-stop-multiplayer.js" defer></script>
</body>

</html>
