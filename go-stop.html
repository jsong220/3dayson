<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Go-Stop (Hwatu)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior-y: none; }
        .card-ghost {
            position: fixed;
            z-index: 9999;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none;
        }
        .card-hover {
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s, z-index 0s;
        }
        .card-hover:hover {
            transform: translateY(-20px) scale(1.1);
            z-index: 50 !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .card-visual { user-select: none; }
        .card-back {
            background-color: #7f1d1d;
            background-image: radial-gradient(#9f1239 1px, transparent 1px);
            background-size: 8px 8px;
        }
        .writing-vertical { writing-mode: vertical-rl; text-orientation: upright; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Selection animations */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.8); }
            70% { box-shadow: 0 0 0 15px rgba(250, 204, 21, 0); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
        }
        .selectable-card {
            cursor: pointer;
            animation: pulse-ring 1.5s infinite;
            border-color: #facc15 !important;
            transform: scale(1.15);
            z-index: 40;
        }
    </style>
</head>
<body class="bg-emerald-900 min-h-screen text-emerald-50 font-sans overflow-hidden flex flex-col p-2">

    <!-- Header -->
    <header class="flex justify-between items-center bg-black/40 px-4 py-2 rounded-xl shadow-md border border-white/10 z-10 mx-auto w-full max-w-5xl mb-2">
        <div id="game-message" class="text-base font-black text-yellow-300 drop-shadow-md tracking-wide">Game Ready</div>
        <button onclick="startNewGame()" class="text-xs font-bold uppercase tracking-wider bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded-lg shadow border border-emerald-500 transition-colors">Restart</button>
    </header>

    <div class="flex-1 max-w-5xl w-full mx-auto flex flex-col relative z-10 justify-between">
        
        <!-- Computer Area -->
        <div class="flex flex-col gap-1">
            <div id="computer-captured" class="bg-black/20 p-2 rounded-xl min-h-[60px] flex items-center gap-2 border border-emerald-800/50"></div>
            <!-- Computer Hand -->
            <div id="computer-hand" class="flex justify-center gap-0 h-28 sm:h-36 px-2 opacity-90 mt-2"></div>
        </div>

        <!-- Table Area (Compact and tightly wrapped) -->
        <div class="bg-emerald-800/40 border-y-2 border-emerald-600/30 py-6 px-4 flex flex-col items-center shadow-inner relative my-2 w-full rounded-2xl">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.15]">
                <span class="font-black text-6xl tracking-[0.3em]">TABLE</span>
            </div>
            
            <div class="flex flex-row items-center w-full justify-center gap-6 relative z-10">
                <!-- Deck in center -->
                <div class="flex flex-col items-center justify-center shrink-0">
                    <div id="deck-stack" class="relative w-[80px] h-[115px] sm:w-[90px] sm:h-[130px] rounded border-2 border-white/30 shadow-xl flex items-center justify-center card-back">
                        <span id="deck-count" class="text-white font-bold text-sm bg-black/70 px-2 py-1 rounded shadow-inner">20</span>
                    </div>
                </div>
                <!-- Played Cards on Table -->
                <div id="table-cards" class="flex flex-wrap items-center justify-start gap-3 flex-1 min-h-[130px]"></div>
            </div>
        </div>

        <!-- Player Area -->
        <div class="flex flex-col gap-1 justify-end">
            <!-- Player Hand -->
            <div id="player-hand" class="flex justify-center bg-black/10 p-4 rounded-t-2xl min-h-[150px] overflow-visible items-end"></div>
            <div id="player-captured" class="bg-black/30 p-2 rounded-b-xl min-h-[70px] flex items-center gap-2 border-t border-emerald-600/50"></div>
        </div>
    </div>

    <!-- Go/Stop Modal -->
    <div id="modal-gostop" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-emerald-100 text-emerald-950 p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center border-4 border-emerald-500 transform transition-transform scale-90 duration-300">
            <h2 class="text-3xl font-black text-emerald-700 mb-2">7+ POINTS!</h2>
            <p id="gostop-message" class="text-base font-bold text-emerald-800 mb-6"></p>
            <div id="gostop-actions" class="flex flex-col gap-2">
                <button onclick="handleGo()" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-lg py-3 rounded-lg shadow-md transition-transform hover:-translate-y-0.5">GO! (Continue)</button>
                <button onclick="handleStop()" class="bg-rose-600 hover:bg-rose-500 text-white font-black text-lg py-3 rounded-lg shadow-md transition-transform hover:-translate-y-0.5">STOP! (Win)</button>
            </div>
            <div id="gostop-waiting" class="hidden py-4"><p class="font-bold text-emerald-800 animate-pulse">Computer deciding...</p></div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-gameover" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-[100] p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white text-slate-900 p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center border-4 border-slate-200 transform transition-transform scale-90 duration-300">
            <h1 id="gameover-title" class="text-4xl font-black mb-1 uppercase"></h1>
            <p id="gameover-message" class="text-slate-500 font-medium mb-6 text-sm"></p>
            <div class="flex gap-3 mb-6">
                <div class="flex-1 bg-emerald-50 rounded-xl p-3 border border-emerald-100">
                    <p class="text-xs font-black text-emerald-800/50 uppercase mb-1">Player</p>
                    <p id="gameover-player-score" class="text-4xl font-black text-emerald-700">0</p>
                </div>
                <div class="flex-1 bg-rose-50 rounded-xl p-3 border border-rose-100">
                    <p class="text-xs font-black text-rose-800/50 uppercase mb-1">Computer</p>
                    <p id="gameover-computer-score" class="text-4xl font-black text-rose-700">0</p>
                </div>
            </div>
            <button onclick="startNewGame()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black text-lg py-4 rounded-xl shadow-lg transition-transform hover:-translate-y-0.5">Play Again</button>
        </div>
    </div>

    <script>
        const CARD_TYPES = { KWANG: 'Kwang', YUL: 'Yul', TTI: 'Tti', PI: 'Pi' };
        const RIBBON_TYPES = { RED_POETRY: 'Red Poetry', BLUE: 'Blue', RED_PLAIN: 'Red Plain' };
        const TYPE_RANK = { [CARD_TYPES.KWANG]: 4, [CARD_TYPES.YUL]: 3, [CARD_TYPES.TTI]: 2, [CARD_TYPES.PI]: 1 };

        // Unified distinct backgrounds for each month
        const MONTH_THEMES = {
            1: { bg: 'bg-green-200', border: 'border-green-400', emoji: '🌲', name: 'Pine' },
            2: { bg: 'bg-red-200', border: 'border-red-400', emoji: '🐦', name: 'Plum' },
            3: { bg: 'bg-pink-200', border: 'border-pink-400', emoji: '🌸', name: 'Cherry' },
            4: { bg: 'bg-stone-300', border: 'border-stone-500', emoji: '🌿', name: 'Wisteria' },
            5: { bg: 'bg-blue-200', border: 'border-blue-400', emoji: '🌉', name: 'Iris' },
            6: { bg: 'bg-purple-200', border: 'border-purple-400', emoji: '🦋', name: 'Peony' },
            7: { bg: 'bg-lime-200', border: 'border-lime-400', emoji: '🐗', name: 'Clover' },
            8: { bg: 'bg-gray-300', border: 'border-gray-500', emoji: '🌕', name: 'Moon' },
            9: { bg: 'bg-yellow-200', border: 'border-yellow-400', emoji: '🍶', name: 'Chrysanthemum' },
            10: { bg: 'bg-orange-200', border: 'border-orange-400', emoji: '🦌', name: 'Maple' },
            11: { bg: 'bg-slate-400', border: 'border-slate-600', emoji: '🦅', name: 'Paulownia' },
            12: { bg: 'bg-teal-200', border: 'border-teal-400', emoji: '🐸', name: 'Rain' },
        };

        const BASE_DECK = [
            { month: 1, type: CARD_TYPES.KWANG }, { month: 1, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_POETRY }, { month: 1, type: CARD_TYPES.PI }, { month: 1, type: CARD_TYPES.PI },
            { month: 2, type: CARD_TYPES.YUL }, { month: 2, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_POETRY }, { month: 2, type: CARD_TYPES.PI }, { month: 2, type: CARD_TYPES.PI },
            { month: 3, type: CARD_TYPES.KWANG }, { month: 3, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_POETRY }, { month: 3, type: CARD_TYPES.PI }, { month: 3, type: CARD_TYPES.PI },
            { month: 4, type: CARD_TYPES.YUL }, { month: 4, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_PLAIN }, { month: 4, type: CARD_TYPES.PI }, { month: 4, type: CARD_TYPES.PI },
            { month: 5, type: CARD_TYPES.YUL }, { month: 5, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_PLAIN }, { month: 5, type: CARD_TYPES.PI }, { month: 5, type: CARD_TYPES.PI },
            { month: 6, type: CARD_TYPES.YUL }, { month: 6, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.BLUE }, { month: 6, type: CARD_TYPES.PI }, { month: 6, type: CARD_TYPES.PI },
            { month: 7, type: CARD_TYPES.YUL }, { month: 7, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_PLAIN }, { month: 7, type: CARD_TYPES.PI }, { month: 7, type: CARD_TYPES.PI },
            { month: 8, type: CARD_TYPES.KWANG }, { month: 8, type: CARD_TYPES.YUL }, { month: 8, type: CARD_TYPES.PI }, { month: 8, type: CARD_TYPES.PI },
            { month: 9, type: CARD_TYPES.YUL, isDoublePi: true }, { month: 9, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.BLUE }, { month: 9, type: CARD_TYPES.PI }, { month: 9, type: CARD_TYPES.PI },
            { month: 10, type: CARD_TYPES.YUL }, { month: 10, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.BLUE }, { month: 10, type: CARD_TYPES.PI }, { month: 10, type: CARD_TYPES.PI },
            { month: 11, type: CARD_TYPES.KWANG }, { month: 11, type: CARD_TYPES.PI, isDoublePi: true }, { month: 11, type: CARD_TYPES.PI }, { month: 11, type: CARD_TYPES.PI },
            { month: 12, type: CARD_TYPES.KWANG }, { month: 12, type: CARD_TYPES.YUL }, { month: 12, type: CARD_TYPES.TTI, ribbon: RIBBON_TYPES.RED_PLAIN }, { month: 12, type: CARD_TYPES.PI, isDoublePi: true },
        ];

        let state = {
            deck: [], playerHand: [], computerHand: [], table: [],
            playerCaptured: [], computerCaptured: [],
            playerScore: 0, computerScore: 0,
            turn: 'player', isAnimating: false, pendingGoStop: null
        };

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        function createCardHTML(card, isHidden = false, interactive = false) {
            if (isHidden) {
                // Increased computer hand card sizes
                return `<div class="card-visual w-[80px] h-[115px] sm:w-[90px] sm:h-[130px] rounded shadow-md border-[2px] border-white/20 card-back"></div>`;
            }

            const theme = MONTH_THEMES[card.month];
            
            let centerContent = '';
            if (card.type === CARD_TYPES.KWANG) {
                centerContent = `<div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-red-600 flex items-center justify-center shadow-inner border-[2px] border-yellow-400 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20"><span class="text-yellow-300 font-bold text-lg sm:text-xl font-serif">光</span></div>`;
            } else if (card.type === CARD_TYPES.TTI) {
                const ribbonColor = card.ribbon === RIBBON_TYPES.RED_POETRY ? 'bg-red-500' : card.ribbon === RIBBON_TYPES.BLUE ? 'bg-blue-600' : 'bg-red-500';
                let ribbonText = card.ribbon === RIBBON_TYPES.RED_POETRY ? '홍단' : card.ribbon === RIBBON_TYPES.BLUE ? '청단' : '';
                centerContent = `<div class="absolute top-1 left-1/2 transform -translate-x-1/2 w-4 sm:w-5 h-14 sm:h-16 shadow-sm border-b border-r border-black/20 z-20 ${ribbonColor}">${ribbonText ? `<div class="text-[10px] text-white text-center font-bold mt-2 opacity-90 writing-vertical mx-auto">${ribbonText}</div>` : ''}</div>`;
            } else if (card.type === CARD_TYPES.YUL && !card.isDoublePi) {
                centerContent = `<div class="text-3xl sm:text-4xl absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 drop-shadow-md">${theme.emoji}</div>`;
            }

            const doublePiBadge = card.isDoublePi ? `<div class="absolute bottom-1 right-1 bg-red-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded z-30 shadow border border-red-800">2x</div>` : '';

            return `
            <div class="card-visual relative w-[80px] h-[115px] sm:w-[90px] sm:h-[130px] rounded shadow-md border-[2px] ${theme.border} ${theme.bg} overflow-hidden text-slate-900 ${interactive ? 'card-hover cursor-pointer' : ''}">
                <div class="absolute inset-0 bg-white opacity-20 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:4px_4px] mix-blend-overlay z-0"></div>
                <div class="absolute top-1 left-1 flex flex-col items-center z-10"><span class="text-[10px] sm:text-xs font-black leading-none bg-white/70 rounded px-1 py-0.5 shadow-sm">${card.month}</span></div>
                <div class="absolute top-1 right-1 text-xs sm:text-sm opacity-70 z-10">${theme.emoji}</div>
                ${centerContent}
                ${doublePiBadge}
            </div>`;
        }

        function renderState() {
            document.getElementById('deck-count').innerText = state.deck.length;
            const msgEl = document.getElementById('game-message');
            if(state.isAnimating && state.turn === 'player' && msgEl.innerText !== "Select a card to capture!") {
               // keep custom messages if set
            } else {
               msgEl.innerText = state.turn === 'player' ? 'Your Turn' : state.turn === 'computer' ? 'Computer Thinking...' : state.message || '';
            }

            // Using significant negative margins (-ml-10 / -ml-14) to overlap the larger cards
            document.getElementById('player-hand').innerHTML = state.playerHand.map((c, i) => `
                <div id="ph-${c.id}" class="-ml-10 sm:-ml-12 first:ml-0 relative z-10 group" onclick="handleCardClick(${i})">
                    ${createCardHTML(c, false, state.turn === 'player')}
                </div>
            `).join('');

            document.getElementById('computer-hand').innerHTML = state.computerHand.map(c => `
                <div id="ch-${c.id}" class="-ml-10 sm:-ml-12 first:ml-0 transform relative z-10">${createCardHTML(c, true)}</div>
            `).join('');

            document.getElementById('table-cards').innerHTML = state.table.map(c => `
                <div id="tb-${c.id}" class="shadow-lg rounded transition-all duration-300">${createCardHTML(c)}</div>
            `).join('');

            renderCapturedArea('player-captured', state.playerCaptured, 'Player', state.playerScore);
            renderCapturedArea('computer-captured', state.computerCaptured, 'CPU', state.computerScore);
        }

        function groupCaptured(cards) {
            return {
                [CARD_TYPES.KWANG]: cards.filter(c => c.type === CARD_TYPES.KWANG),
                [CARD_TYPES.YUL]: cards.filter(c => c.type === CARD_TYPES.YUL),
                [CARD_TYPES.TTI]: cards.filter(c => c.type === CARD_TYPES.TTI),
                [CARD_TYPES.PI]: cards.filter(c => c.type === CARD_TYPES.PI),
            };
        }

        function renderCapturedArea(elementId, cards, title, score) {
            const container = document.getElementById(elementId);
            const grouped = groupCaptured(cards);
            let html = `
                <div class="flex flex-col justify-center items-center min-w-[60px] px-2 py-1 rounded-lg bg-black/40 text-emerald-100 border border-white/10 shadow-inner">
                    <h3 class="font-bold text-[10px] uppercase text-emerald-400 tracking-wider">${title}</h3>
                    <p class="text-2xl font-black text-white leading-none drop-shadow">${score}</p>
                </div>
                <div class="flex gap-3 flex-1 overflow-x-auto no-scrollbar items-center py-1">
            `;
            for (const [type, typeCards] of Object.entries(grouped)) {
                if (typeCards.length === 0) continue;
                html += `
                    <div class="flex items-center bg-black/30 rounded-lg px-2 py-1 h-full border border-white/5">
                        <span class="text-[9px] font-black text-emerald-500/80 w-8 uppercase truncate mr-2">${type}</span>
                        <div class="flex -space-x-8">
                            ${typeCards.map(c => `<div class="transform scale-[0.55] sm:scale-[0.6] origin-left drop-shadow hover:z-20 hover:-translate-y-2 transition-transform">${createCardHTML(c)}</div>`).join('')}
                        </div>
                    </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        async function animateGhostCard(card, startElId, endElId, delay = 350) {
            const startEl = document.getElementById(startElId);
            const endEl = document.getElementById(endElId);
            if (!startEl || !endEl) return;

            const startRect = startEl.getBoundingClientRect();
            const endRect = endEl.getBoundingClientRect();

            const ghost = document.createElement('div');
            ghost.className = 'card-ghost shadow-2xl';
            ghost.innerHTML = createCardHTML(card);
            ghost.style.left = `${startRect.left}px`;
            ghost.style.top = `${startRect.top}px`;
            ghost.style.width = `${startRect.width}px`;
            ghost.style.height = `${startRect.height}px`;

            document.body.appendChild(ghost);
            void ghost.offsetWidth; // Force reflow

            ghost.style.left = `${endRect.left + (endRect.width/2 - startRect.width/2)}px`;
            ghost.style.top = `${endRect.top + (endRect.height/2 - startRect.height/2)}px`;
            ghost.style.transform = `scale(1.05) rotate(${Math.random() > 0.5 ? 5 : -5}deg)`;

            await sleep(delay);
            ghost.remove();
        }

        function promptUserSelection(cardsToChooseFrom) {
            return new Promise(resolve => {
                document.getElementById('game-message').innerText = "Select a card to capture!";
                cardsToChooseFrom.forEach(c => {
                    const el = document.getElementById(`tb-${c.id}`);
                    if(el) {
                        const innerCard = el.firstElementChild;
                        innerCard.classList.add('selectable-card');
                        innerCard.onclick = () => {
                            // Clean up handlers
                            cardsToChooseFrom.forEach(c2 => {
                                const el2 = document.getElementById(`tb-${c2.id}`);
                                if(el2) {
                                    el2.firstElementChild.classList.remove('selectable-card');
                                    el2.firstElementChild.onclick = null;
                                }
                            });
                            resolve(c);
                        };
                    }
                });
            });
        }

        async function processMatches(playedCard, playerType) {
            let matches = state.table.filter(c => c.month === playedCard.month);
            let captured = [];
            
            if (matches.length === 3) {
                captured.push(playedCard, ...matches);
                state.table = state.table.filter(c => c.month !== playedCard.month);
            } else if (matches.length === 2) {
                let chosen;
                if (playerType === 'player') {
                    chosen = await promptUserSelection(matches);
                } else {
                    chosen = matches.sort((a,b) => TYPE_RANK[b.type] - TYPE_RANK[a.type])[0]; // AI picks highest
                }
                captured.push(playedCard, chosen);
                state.table = state.table.filter(c => c.id !== chosen.id);
            } else if (matches.length === 1) {
                captured.push(playedCard, matches[0]);
                state.table = state.table.filter(c => c.id !== matches[0].id);
            } else {
                state.table.push(playedCard);
            }
            return captured;
        }

        function calculateScore(capturedCards) {
            let kwangs = capturedCards.filter(c => c.type === CARD_TYPES.KWANG).length;
            let yuls = capturedCards.filter(c => c.type === CARD_TYPES.YUL).length;
            let ttis = capturedCards.filter(c => c.type === CARD_TYPES.TTI).length;
            let pis = capturedCards.reduce((acc, c) => acc + (c.isDoublePi ? 2 : 1), 0);

            let score = 0;
            if (kwangs === 5) score += 15; else if (kwangs === 4) score += 4; else if (kwangs === 3) score += 3;
            if (yuls >= 5) score += (yuls - 4);
            if (ttis >= 5) score += (ttis - 4);
            if (pis >= 10) score += (pis - 9);
            return score;
        }

        async function handleCardClick(index) {
            if (state.turn !== 'player' || state.isAnimating) return;
            await playTurn('player', index);
        }

        async function playTurn(playerType, cardIndex) {
            state.isAnimating = true;
            renderState();

            const handKey = playerType === 'player' ? 'playerHand' : 'computerHand';
            const capturedKey = playerType === 'player' ? 'playerCaptured' : 'computerCaptured';
            const handPrefix = playerType === 'player' ? 'ph' : 'ch';
            const targetArea = playerType === 'player' ? 'player-captured' : 'computer-captured';

            // 1. Play Hand Card
            const playedCard = state[handKey][cardIndex];
            const startId = `${handPrefix}-${playedCard.id}`;
            
            state[handKey].splice(cardIndex, 1);
            if(document.getElementById(startId)) document.getElementById(startId).style.opacity = '0'; 

            // Calculate destination on table based on match
            let matches = state.table.filter(c => c.month === playedCard.month);
            let targetId = matches.length > 0 ? `tb-${matches[0].id}` : 'table-cards';

            await animateGhostCard(playedCard, startId, targetId, 350);
            
            let capturedHand = await processMatches(playedCard, playerType);
            renderState();

            if (capturedHand.length > 0) {
                await sleep(200);
                await animateGhostCard(capturedHand[0], targetId, targetArea, 350);
                state[capturedKey].push(...capturedHand);
                renderState();
            }

            // 2. Draw Deck Card
            if (state.deck.length > 0) {
                await sleep(300);
                const deckCard = state.deck.pop();
                renderState();

                let deckMatches = state.table.filter(c => c.month === deckCard.month);
                let deckTargetId = deckMatches.length > 0 ? `tb-${deckMatches[0].id}` : 'table-cards';

                await animateGhostCard(deckCard, 'deck-stack', deckTargetId, 350);
                
                let capturedDeck = await processMatches(deckCard, playerType);
                renderState();

                if (capturedDeck.length > 0) {
                    await sleep(200);
                    await animateGhostCard(capturedDeck[0], deckTargetId, targetArea, 350);
                    state[capturedKey].push(...capturedDeck);
                    renderState();
                }
            }

            // 3. Scoring & Validation
            const currentScore = playerType === 'player' ? state.playerScore : state.computerScore;
            const newScore = calculateScore(state[capturedKey]);
            
            if (playerType === 'player') state.playerScore = newScore;
            else state.computerScore = newScore;
            
            renderState();
            await sleep(400);

            if (state.playerHand.length === 0 && state.computerHand.length === 0) {
                showGameOver();
                return;
            }

            if (newScore >= 7 && newScore > currentScore) {
                state.pendingGoStop = playerType;
                showGoStopModal(playerType, newScore);
                return; 
            }

            passTurn(playerType);
        }

        function passTurn(currentPlayer) {
            state.turn = currentPlayer === 'player' ? 'computer' : 'player';
            state.isAnimating = false;
            renderState();
            if (state.turn === 'computer') setTimeout(playComputerTurn, 800);
        }

        function playComputerTurn() {
            let bestIndex = 0;
            for (let i = 0; i < state.computerHand.length; i++) {
                if (state.table.some(tCard => tCard.month === state.computerHand[i].month)) {
                    bestIndex = i; break;
                }
            }
            playTurn('computer', bestIndex);
        }

        function showGoStopModal(playerType, score) {
            const modal = document.getElementById('modal-gostop');
            const msg = document.getElementById('gostop-message');
            const actions = document.getElementById('gostop-actions');
            const waiting = document.getElementById('gostop-waiting');
            const modalInner = modal.querySelector('div');

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modalInner.classList.remove('scale-90'); modalInner.classList.add('scale-100'); }, 10);

            if (playerType === 'player') {
                msg.innerText = `You reached ${score} points!`;
                actions.classList.remove('hidden'); waiting.classList.add('hidden');
            } else {
                msg.innerText = `Computer reached ${score} points!`;
                actions.classList.add('hidden'); waiting.classList.remove('hidden');
                setTimeout(() => handleStop(true), 2000); // Computer stops automatically for now
            }
        }

        function closeGoStopModal() {
            const modal = document.getElementById('modal-gostop');
            const modalInner = modal.querySelector('div');
            modal.classList.add('opacity-0'); modalInner.classList.remove('scale-100'); modalInner.classList.add('scale-90');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function handleGo(isComputer = false) {
            closeGoStopModal();
            state.message = `${isComputer ? 'Computer' : 'Player'} called GO!`;
            const prevPlayer = state.pendingGoStop;
            state.pendingGoStop = null;
            passTurn(prevPlayer);
        }

        function handleStop(isComputer = false) {
            closeGoStopModal();
            showGameOver(isComputer ? 'Computer' : 'Player');
        }

        function showGameOver(winner = null) {
            state.isAnimating = true;
            if (!winner) {
                winner = state.playerScore > state.computerScore ? 'Player' : state.computerScore > state.playerScore ? 'Computer' : 'Draw';
            }

            const modal = document.getElementById('modal-gameover');
            const title = document.getElementById('gameover-title');
            const msg = document.getElementById('gameover-message');
            const modalInner = modal.querySelector('div');

            document.getElementById('gameover-player-score').innerText = state.playerScore;
            document.getElementById('gameover-computer-score').innerText = state.computerScore;

            if (winner === 'Player') {
                title.innerText = 'You Win!'; title.className = "text-5xl font-black mb-1 uppercase text-emerald-600";
            } else if (winner === 'Computer') {
                title.innerText = 'CPU Wins!'; title.className = "text-5xl font-black mb-1 uppercase text-rose-600";
            } else {
                title.innerText = 'Draw!'; title.className = "text-5xl font-black mb-1 uppercase text-slate-600";
            }

            msg.innerText = winner === 'Draw' ? "No cards left." : `${winner} called STOP.`;

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modalInner.classList.remove('scale-90'); modalInner.classList.add('scale-100'); }, 10);
        }

        function closeGameOverModal() {
            const modal = document.getElementById('modal-gameover');
            const modalInner = modal.querySelector('div');
            modal.classList.add('opacity-0'); modalInner.classList.remove('scale-100'); modalInner.classList.add('scale-90');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function startNewGame() {
            closeGameOverModal(); closeGoStopModal();
            let deck = BASE_DECK.map((c, i) => ({ ...c, id: `c_${i}` }));
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            state = {
                deck: deck.splice(0, 20), playerHand: deck.splice(0, 10), computerHand: deck.splice(0, 10), table: deck.splice(0, 8),
                playerCaptured: [], computerCaptured: [], playerScore: 0, computerScore: 0,
                turn: 'player', message: 'Game started!', isAnimating: false, pendingGoStop: null
            };
            renderState();
        }

        window.onload = startNewGame;
    </script>
</body>
</html>
